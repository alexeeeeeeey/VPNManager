name: Cross-platform binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/386
          - linux/arm
          - linux/loong64
          - linux/ppc64le
          - linux/riscv64
          - linux/s390x
          - windows/amd64
          - windows/arm64
          - windows/386
          - darwin/amd64
          - darwin/arm64
          - freebsd/amd64
          - freebsd/arm64
          - freebsd/386
          - freebsd/arm
          - netbsd/amd64
          - openbsd/amd64
          - openbsd/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Compile
        id: compile
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          if [[ "$GOARCH" == arm ]]; then export GOARM=7; fi
          binary=vpn-manager
          if [[ "$GOOS" == windows ]]; then binary+=.exe; fi
          version=dev
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.buildVersion=$version" -o "dist/$binary" ./cmd/vpn-manager
          (cd dist && sha256sum "$binary" > checksums.txt)
          echo "name=vpn-manager-$GOOS-$GOARCH" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compile.outputs.name }}
          path: dist/
